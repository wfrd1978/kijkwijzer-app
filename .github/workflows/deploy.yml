name: Online zetten

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Elke nacht opnieuw (01:37 UTC = 02:37 of 03:37 Nederlandse tijd), voor een vers voetbalschema,
  # de ESPN-kanalen en de NPO-gids. GitHub start geplande runs soms uren later; zo is het toch
  # ruim vóór 06:00 klaar. De eigen app van de eigenaar draait op een ander tijdstip (zelfde voetbalsleutel).
  schedule:
    - cron: '37 1 * * *'

# Standaard alleen lezen; alleen de stap die online zet mag publiceren.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # De hele geschiedenis: de versie in de app is het moment van de laatste codewijziging.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Eerst de tests: faalt er één, dan wordt er niets online gezet.
      - run: npm test
      # Voetbalschema van football-data.org; de sleutel staat als geheim in GitHub, niet in de code.
      # Lukt het niet, dan gaat het online zetten gewoon door (de app toont dan een melding).
      - name: Voetbalschema ophalen
        timeout-minutes: 10
        run: node scripts/voetbal.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        continue-on-error: true
      # Op welk ESPN-kanaal elke Eredivisie-wedstrijd komt (openbare pagina van Ziggo).
      - name: ESPN-kanalen ophalen
        timeout-minutes: 6
        run: node scripts/espn.mjs
        continue-on-error: true
      # Avonden op NPO 1, 2 en 3 voor Vanavond op de NPO (gids van npo.nl, zonder sleutel).
      - name: NPO-gids ophalen
        timeout-minutes: 6
        run: node scripts/npo.mjs
        continue-on-error: true
      # Vangnet: liep een ophaalstap vast, dan de vorige versie van dat schema meenemen.
      - name: Ontbrekende schema's aanvullen
        run: node scripts/aanvullen.mjs
      # De gedeelde TMDB-sleutel (GitHub-geheim TMDB_SLEUTEL) gaat mee in de app, zodat
      # gebruikers niets hoeven in te voeren. Hij staat niet in de code; wie wil, plakt een eigen sleutel.
      - run: npm run build
        env:
          VITE_TMDB_STANDAARD: ${{ secrets.TMDB_SLEUTEL }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
